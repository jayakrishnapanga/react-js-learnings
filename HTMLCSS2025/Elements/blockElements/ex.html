<!-- 
text-align: center only centers text horizontally, not vertically.
So in your code:
<div style="text-align: center;">hellooo</div>
<li style="text-align: center;">List item 1</li>

The text is centered left → right


But it stays at the top because vertical alignment is not controlled
 -->

<!-- Why text appears on the top?
A div and li are block elements, and since you gave height (200px), the text occupies only one line at the top inside that block. There is no CSS telling it to move to the middle vertically.

How to center text vertically and horizontally
Use flexbox:
<div
  style="
    width: 200px;
    height: 200px;
    border: 2px solid black;
    display: flex;
    justify-content: center;
    align-items: center;
  "
>
  hellooo
</div> -->
