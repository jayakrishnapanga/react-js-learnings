<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #eee;
      }

      @keyframes moveAndColor {
        from {
          transform: translateX(0);
          background: red;
        }
        to {
          transform: translateX(200px);
          background: green;
        }
      }

      .box {
        width: 100px;
        height: 100px;
        /* background: red; */
        background: pink;

        animation: moveAndColor 5s linear 5s forwards;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
