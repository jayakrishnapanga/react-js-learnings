<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 200px;
      height: 100px;
      border: 2px solid black;
      overflow: scroll;
    }
    .content {
      width: 400px;
      height: 200px;
      background: lightgreen;
    }
  </style>
</head>
<body>
  <h2>overflow: scroll</h2>
  <div class="box">
    <div class="content">This content scrolls. Even if it fits, scrollbars appear.</div>
  </div>
</body>
</html>
