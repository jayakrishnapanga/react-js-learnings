<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 200px;
      height: 100px;
      border: 2px solid black;
      overflow: visible; /* default */
    }
    .content {
      width: 400px;
      height: 150px;
      background: lightblue;
    }
  </style>
</head>
<body>
  <h2>overflow: visible (default)</h2>
  <div class="box">
    <div class="content">This content overflows visibly.</div>
  </div>
</body>
</html>
