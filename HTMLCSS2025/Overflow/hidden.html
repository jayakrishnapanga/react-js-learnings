<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 200px;
      height: 100px;
      border: 2px solid black;
      overflow: hidden;
    }
    .content {
      width: 400px;
      height: 150px;
      background: salmon;
    }
  </style>
</head>
<body>
  <h2>overflow: hidden</h2>
  <div class="box">
    <div class="content">This content gets cut off.</div>
  </div>
</body>
</html>
