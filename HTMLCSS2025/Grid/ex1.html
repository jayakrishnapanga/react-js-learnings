<!DOCTYPE html>
<html>
  <head>
    <style>
      .grid-container {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }
      .grid-item {
        background: lightseagreen;
        padding: 20px;
        color: white;
        font-size: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
    </div>
  </body>
</html>
