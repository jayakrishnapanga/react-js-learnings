<!DOCTYPE html>
<html>
<head>
  <style>
    .grid {
      display: grid;
      width: 400px;
      height: 400px;
      border: 2px solid black;

      /* 3 columns × 3 rows */
      grid-template-columns: 100px 100px 100px;
      grid-template-rows: 100px 100px 100px;

      gap: 5px; /* spacing between cells */
    }

    .grid > div {
      background: lightblue;
      border: 1px solid blue;
    }

    /* Try changing this */
    .special {
      background: lightcoral;
      grid-area: 1 / 2 /1 / 4; 
      /* row-start / col-start / row-end / col-end */
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="special">Special</div>
    <div>Box 2</div>
    <div>Box 3</div>
    <div>Box 4</div>
    <div>Box 5</div>
    <div>Box 6</div>
    <div>Box 7</div>
    <div>Box 8</div>
    <div>Box 9</div>
  </div>
</body>
</html>
