<!DOCTYPE html>
<html>
<head>
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      grid-auto-rows: 100px;      /* base row height */
      grid-auto-flow: dense;      /* pack tightly */
      gap: 10px;
    }

    .item {
      background: lightblue;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    /* Different item sizes (like images with diff heights) */
    .tall  { grid-row: span 2; background: lightcoral; }
    .wide  { grid-column: span 2; background: lightgreen; }
    .big   { grid-column: span 2; grid-row: span 2; background: lightgoldenrodyellow; }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="item tall">1</div>
    <div class="item">2</div>
    <div class="item wide">3</div>
    <div class="item">4</div>
    <div class="item big">5</div>
    <div class="item">6</div>
    <div class="item tall">7</div>
    <div class="item">8</div>
    <div class="item wide">9</div>
  </div>
</body>
</html>
